<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Finance Dashboard</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Fallback styles in case Tailwind doesn't load */
        .bg-gray-50 { background-color: #f9fafb; }
        .text-3xl { font-size: 1.875rem; }
        .font-bold { font-weight: 700; }
        .p-4 { padding: 1rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .bg-white { background-color: white; }
        .rounded-xl { border-radius: 0.75rem; }
        .shadow-sm { box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const FinanceDashboard = () => {
            const [currentMonth, setCurrentMonth] = React.useState(new Date().toISOString().slice(0, 7));
            const [activeTab, setActiveTab] = React.useState('overview');
            const [showAddTransaction, setShowAddTransaction] = React.useState(false);

            // Financial data state with sample data
            const [monthlyData, setMonthlyData] = React.useState({
                [new Date().toISOString().slice(0, 7)]: {
                    transactions: [
                        { id: 1, type: 'expense', category: 'housing', amount: 1200, description: 'Rent', date: '2025-09-01' },
                        { id: 2, type: 'expense', category: 'food', amount: 45.50, description: 'Groceries', date: '2025-09-02' },
                        { id: 3, type: 'expense', category: 'transport', amount: 60, description: 'Gas', date: '2025-09-03' },
                        { id: 4, type: 'income', category: 'salary', amount: 2500, description: 'Paycheck', date: '2025-09-15' },
                    ]
                }
            });

            const [newTransaction, setNewTransaction] = React.useState({
                type: 'expense',
                category: 'food',
                amount: '',
                description: ''
            });

            const categories = {
                expense: {
                    housing: { name: 'Housing', color: '#ef4444' },
                    food: { name: 'Food & Dining', color: '#f97316' },
                    transport: { name: 'Transportation', color: '#3b82f6' },
                    shopping: { name: 'Shopping', color: '#8b5cf6' },
                    entertainment: { name: 'Entertainment', color: '#10b981' },
                    health: { name: 'Healthcare', color: '#ec4899' },
                    other: { name: 'Other', color: '#6b7280' }
                },
                income: {
                    salary: { name: 'Salary', color: '#059669' },
                    freelance: { name: 'Freelance', color: '#2563eb' },
                    investment: { name: 'Investments', color: '#7c3aed' },
                    other: { name: 'Other Income', color: '#4b5563' }
                }
            };

            const getCurrentMonthData = () => {
                return monthlyData[currentMonth] || { transactions: [] };
            };

            const calculateTotals = () => {
                const data = getCurrentMonthData();
                const expenses = data.transactions
                    .filter(t => t.type === 'expense')
                    .reduce((sum, t) => sum + t.amount, 0);
                const income = data.transactions
                    .filter(t => t.type === 'income')
                    .reduce((sum, t) => sum + t.amount, 0);
                
                return {
                    income,
                    expenses,
                    balance: income - expenses,
                    savings: Math.max(0, income - expenses)
                };
            };

            const addTransaction = () => {
                if (!newTransaction.amount || !newTransaction.description) return;
                
                const transaction = {
                    id: Date.now(),
                    ...newTransaction,
                    amount: parseFloat(newTransaction.amount),
                    date: new Date().toISOString().split('T')[0]
                };

                setMonthlyData(prev => ({
                    ...prev,
                    [currentMonth]: {
                        ...prev[currentMonth] || { transactions: [] },
                        transactions: [...(prev[currentMonth]?.transactions || []), transaction]
                    }
                }));

                setNewTransaction({
                    type: 'expense',
                    category: 'food',
                    amount: '',
                    description: ''
                });
                setShowAddTransaction(false);
            };

            const removeTransaction = (transactionId) => {
                setMonthlyData(prev => ({
                    ...prev,
                    [currentMonth]: {
                        ...prev[currentMonth],
                        transactions: prev[currentMonth]?.transactions.filter(t => t.id !== transactionId) || []
                    }
                }));
            };

            // Helper function for consistent currency formatting
            const formatCurrency = (amount) => {
                return amount.toLocaleString(undefined, {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                });
            };

            // Chart setup
            React.useEffect(() => {
                const ctx = document.getElementById('financeChart').getContext('2d');
                const financeChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: ['Income', 'Expenses', 'Balance'],
                        datasets: [{
                            label: 'Amount ($)',
                            data: [
                                calculateTotals().income,
                                calculateTotals().expenses,
                                calculateTotals().balance
                            ],
                            backgroundColor: [
                                'rgba(16, 185, 129, 0.6)', // Income (green)
                                'rgba(239, 68, 68, 0.6)', // Expenses (red)
                                'rgba(59, 130, 246, 0.6)' // Balance (blue)
                            ],
                            borderColor: [
                                'rgba(16, 185, 129, 1)',
                                'rgba(239, 68, 68, 1)',
                                'rgba(59, 130, 246, 1)'
                            ],
                            borderWidth: 1,
                            borderRadius: {
                                topLeft: 10,
                                topRight: 10,
                                bottomLeft: 0,
                                bottomRight: 0
                            }, // Round only top edges
                            borderSkipped: false // Ensure all corners are considered for rounding
                        }]
                    },
                    options: {
                        scales: {
                            y: {
                                beginAtZero: true,
                                title: {
                                    display: true,
                                    text: 'Amount ($)'
                                }
                            }
                        },
                        plugins: {
                            legend: {
                                display: false
                            }
                        }
                    }
                });

                // Cleanup chart on component unmount
                return () => {
                    financeChart.destroy();
                };
            }, [currentMonth, monthlyData]);

            const totals = calculateTotals();
            const savingsRate = totals.income > 0 ? (totals.savings / totals.income) * 100 : 0;

            return (
                <div className="max-w-7xl mx-auto p-4 bg-gray-50 min-h-screen">
                    {/* Header */}
                    <div className="bg-white rounded-xl shadow-sm p-6 mb-6">
                        <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                            <div>
                                <h1 className="text-3xl font-bold text-gray-800">💰 Personal Finance Dashboard</h1>
                                <p className="text-gray-600">Track your income, expenses, and reach your financial goals</p>
                            </div>
                            <div className="flex items-center gap-3">
                                <span>📅</span>
                                <input
                                    type="month"
                                    value={currentMonth}
                                    onChange={(e) => setCurrentMonth(e.target.value)}
                                    className="border border-gray-300 rounded-lg px-3 py-2"
                                />
                            </div>
                        </div>
                    </div>

                    {/* Financial Summary Cards */}
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                        <div className="bg-gradient-to-br from-green-500 to-green-600 text-white p-6 rounded-xl">
                            <div className="flex items-center justify-between">
                                <div>
                                    <p className="text-green-20 text-sm">Monthly Income</p>
                                    <p className="text-2xl font-bold">${formatCurrency(totals.income)}</p>
                                </div>
                                <span className="text-3xl">📈</span>
                            </div>
                        </div>
                        
                        <div className="bg-gradient-to-br from-red-500 to-red-600 text-white p-6 rounded-xl">
                            <div className="flex items-center justify-between">
                                <div>
                                    <p className="text-red-20 text-sm">Monthly Expenses</p>
                                    <p className="text-2xl font-bold">${formatCurrency(totals.expenses)}</p>
                                </div>
                                <span className="text-3xl">📉</span>
                            </div>
                        </div>
                        
                        <div className={`bg-gradient-to-br ${totals.balance >= 0 ? 'from-blue-500 to-blue-600' : 'from-orange-500 to-orange-600'} text-white p-6 rounded-xl`}>
                            <div className="flex items-center justify-between">
                                <div>
                                    <p className="text-blue-20 text-sm">Net Balance</p>
                                    <p className="text-2xl font-bold">${formatCurrency(totals.balance)}</p>
                                </div>
                                <span className="text-3xl">💵</span>
                            </div>
                        </div>
                        
                        <div className="bg-gradient-to-br from-purple-500 to-purple-600 text-white p-6 rounded-xl">
                            <div className="flex items-center justify-between">
                                <div>
                                    <p className="text-purple-20 text-sm">Savings Rate</p>
                                    <p className="text-2xl font-bold">{savingsRate.toFixed(1)}%</p>
                                </div>
                                <span className="text-3xl">🐷</span>
                            </div>
                        </div>
                    </div>

                    {/* Bar Graph */}
                    <div className="bg-white rounded-xl p-6 border border-gray-200 mb-6">
                        <h3 className="text-lg font-semibold flex items-center gap-2 mb-4">
                            <span>📊</span>
                            Financial Overview
                        </h3>
                        <div className="flex justify-center">
                            <div className="w-full max-w-lg h-64">
                                <canvas id="financeChart"></canvas>
                            </div>
                        </div>
                    </div>

                    {/* Budget Status Alert */}
                    <div className={`p-4 rounded-lg border-l-4 mb-6 ${
                        savingsRate >= 20 ? 'bg-green-50 border-green-500' :
                        savingsRate >= 10 ? 'bg-yellow-50 border-yellow-500' :
                        'bg-red-50 border-red-500'
                    }`}>
                        <div className="flex items-center gap-2">
                            <span>{savingsRate >= 20 ? '✅' : savingsRate >= 10 ? '⚠️' : '🚨'}</span>
                            <span className="font-medium">
                                {savingsRate >= 20 ? 'Excellent savings rate!' : 
                                 savingsRate >= 10 ? 'Good savings, but room to improve' : 
                                 'Try to save at least 10% of income'}
                            </span>
                        </div>
                    </div>

                    {/* Recent Transactions */}
                    <div className="bg-white rounded-xl p-6 border border-gray-200 mb-6">
                        <div className="flex items-center justify-between mb-4">
                            <h3 className="text-lg font-semibold flex items-center gap-2">
                                <span>📊</span>
                                Recent Transactions
                            </h3>
                            <button
                                onClick={() => setShowAddTransaction(true)}
                                className="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg flex items-center gap-2 transition-colors"
                            >
                                <span style={{ fontSize : "22px" }}>+</span>
                                Add Transaction
                            </button>
                        </div>
                        <div className="space-y-2 max-h-64 overflow-y-auto">
                            {getCurrentMonthData().transactions.slice(-10).reverse().map(transaction => {
                                const categoryInfo = categories[transaction.type][transaction.category];
                                
                                return (
                                    <div key={transaction.id} className="flex items-center justify-between p-3 bg-gray-50 rounded-lg group hover:bg-gray-100 transition-colors">
                                        <div className="flex items-center gap-3">
                                            <div 
                                                className="w-10 h-10 rounded-full flex items-center justify-center text-white"
                                                style={{ backgroundColor: categoryInfo.color }}
                                            >
                                                {transaction.type === 'income' ? '💰' : '💳'}
                                            </div>
                                            <div>
                                                <div className="font-medium">{transaction.description}</div>
                                                <div className="text-sm text-gray-500">{categoryInfo.name}</div>
                                            </div>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <div className="text-right">
                                                <div className={`font-semibold ${transaction.type === 'income' ? 'text-green-600' : 'text-red-600'}`}>
                                                    {transaction.type === 'income' ? '+' : '-'}${formatCurrency(transaction.amount)}
                                                </div>
                                                <div className="text-sm text-gray-500">
                                                    {new Date(transaction.date).toLocaleDateString()}
                                                </div>
                                            </div>
                                            <button
                                                onClick={() => removeTransaction(transaction.id)}
                                                className="opacity-0 group-hover:opacity-100 transition-opacity bg-red-500 hover:bg-red-600 text-white p-2 rounded-lg ml-2"
                                                title="Delete transaction"
                                            >
                                                🗑️
                                            </button>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    {/* Add Transaction Modal */}
                    {showAddTransaction && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-xl p-6 max-w-md w-full">
                                <h3 className="text-xl font-semibold mb-4">Add Transaction</h3>
                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-medium mb-1">Type</label>
                                        <select
                                            value={newTransaction.type}
                                            onChange={(e) => setNewTransaction(prev => ({ 
                                                ...prev, 
                                                type: e.target.value, 
                                                category: e.target.value === 'income' ? 'salary' : 'food' 
                                            }))}
                                            className="w-full border border-gray-300 rounded-lg px-3 py-2"
                                        >
                                            <option value="expense">Expense</option>
                                            <option value="income">Income</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium mb-1">Category</label>
                                        <select
                                            value={newTransaction.category}
                                            onChange={(e) => setNewTransaction(prev => ({ ...prev, category: e.target.value }))}
                                            className="w-full border border-gray-300 rounded-lg px-3 py-2"
                                        >
                                            {Object.entries(categories[newTransaction.type]).map(([key, cat]) => (
                                                <option key={key} value={key}>{cat.name}</option>
                                            ))}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium mb-1">Amount</label>
                                        <input
                                            type="number"
                                            step="0.01"
                                            value={newTransaction.amount}
                                            onChange={(e) => setNewTransaction(prev => ({ ...prev, amount: e.target.value }))}
                                            className="w-full border border-gray-300 rounded-lg px-3 py-2"
                                            placeholder="0.00"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium mb-1">Description</label>
                                        <input
                                            type="text"
                                            value={newTransaction.description}
                                            onChange={(e) => setNewTransaction(prev => ({ ...prev, description: e.target.value }))}
                                            className="w-full border border-gray-300 rounded-lg px-3 py-2"
                                            placeholder="Enter description..."
                                        />
                                    </div>
                                </div>
                                <div className="flex gap-3 mt-6">
                                    <button
                                        onClick={() => setShowAddTransaction(false)}
                                        className="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-700 py-2 rounded-lg transition-colors"
                                    >
                                        Cancel
                                    </button>
                                    <button
                                        onClick={addTransaction}
                                        disabled={!newTransaction.amount || !newTransaction.description}
                                        className="flex-1 bg-blue-500 hover:bg-blue-600 disabled:bg-gray-400 disabled:cursor-not-allowed text-white py-2 rounded-lg transition-colors"
                                    >
                                        Add Transaction
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // Mount the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<FinanceDashboard />);
    </script>
</body>
</html>
